name: Automated DevOps Pipeline

on:
  push:
    branches: [ "main" ] # Triggers the pipeline every time you push code to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Authenticate with Azure Cloud
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }} # Pulls your secure key from the GitHub vault

    - name: Build and Push Docker Image to Azure Registry
      run: |
        az acr login --name devopspipelineregistry2026
        docker build -t devopspipelineregistry2026.azurecr.io/python-app:${{ github.sha }} .
        docker push devopspipelineregistry2026.azurecr.io/python-app:${{ github.sha }}

    - name: Deploy Image to Live Azure Container App
      run: |
        az containerapp update \
          --name my-live-web-app \
          --resource-group RealWorldDevOpsRG \
          --image devopspipelineregistry2026.azurecr.io/python-app:${{ github.sha }}
